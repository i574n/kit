[package.metadata.kit]
developer-tool = true

[package.metadata.spiral]
entry = "main.spi"
output = "lift.rs"

[[package.metadata.spiral.auxiliary]]
entry = "self_tests.spi"
output = "self_tests.rs"

[[test]]
name = "native_codemod"
path = "self_tests.rs"
harness = false

[package]
name = "kit-predicate-lift"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kit-lift-predicate"
path = "lift.rs"

[dependencies]
kit-rust-std-fs = { path = "../rust_std_fs" }
predicate-lex-domain = { path = "../predicate_lex_domain" }
predicate-literal-domain = { path = "../predicate_literal_domain" }
predicate-rewrite-domain = { path = "../predicate_rewrite_domain" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kit_coverage)'] }
