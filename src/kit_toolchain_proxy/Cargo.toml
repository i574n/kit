[package.metadata.spiral]
entry = "toolchain.spi"
output = "toolchain.rs"

[package]
name = "kit-toolchain-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kit_toolchain_proxy"
path = "toolchain.rs"

[dependencies]
canonical-plan-ir-domain = { path = "../canonical_plan_ir_domain" }
kit-process = { path = "../kit_process" }
kit-process-observation = { path = "../kit_process_observation" }
kit-proxy-search = { path = "../kit_proxy_search" }
process-batch-plan-domain = { path = "../process_batch_plan_domain" }
toolchain-command-domain = { path = "../toolchain_command_domain" }
command-spec-domain = { path = "../command_spec_domain" }
toolchain-runtime-policy-domain = { path = "../toolchain_runtime_policy_domain" }
toolchain-argument-domain = { path = "../toolchain_argument_domain" }
toolchain-argument-tail-domain = { path = "../toolchain_argument_tail_domain" }

[lints.rust]
dead_code = "allow"

[lints.clippy]
needless_late_init = "allow"
needless_return = "allow"
