[package.metadata.spiral]
entry = "main.spi"
output = "fs_actions.rs"

[package]
name = "kit-fs-actions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kit_fs_actions"
path = "fs_actions.rs"

[dependencies]
canonical-plan-ir-domain = { path = "../canonical_plan_ir_domain" }
kit-rust-std-fs = { path = "../rust_std_fs" }
kit-rust-std-fs-mutation = { path = "../rust_std_fs_mutation" }
kit-patch-control-domain = { path = "../patch_control_domain" }
kit-patch-driver-domain = { path = "../patch_driver_domain" }
kit-proxy-search = { path = "../kit_proxy_search" }
kit-process = { path = "../kit_process" }

[lints.clippy]
needless_return = "allow"
needless_late_init = "allow"
