[package.metadata.spiral]
entry = "main.spi"
output = "cold_proof.rs"

[package]
name = "cold-proof-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cold_proof_domain"
path = "cold_proof.rs"

[dependencies]
kit-proxy-search = { path = "../kit_proxy_search" }
kit-rust-std-fs = { path = "../rust_std_fs" }
kit-source-map = { path = "../kit_source_map" }
kit-source-topology = { path = "../kit_source_topology" }

[lints.rust]
dead_code = "allow"

[lints.clippy]
needless_return = "allow"
